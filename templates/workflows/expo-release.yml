# Expo 앱 릴리스 — main 머지 자동 배포 + 스토어 출시.
#
# main에 머지될 때마다 플랫폼별로 판정한다 (scripts/expo-release/auto-plan.sh):
#   앱 파일 변경 없음(문서·테스트·CI만)          → 아무것도 안 함
#   JS만 바뀜 (fingerprint = 마지막 스토어 빌드)  → EAS Update(OTA) — 깔린 앱이 바로 받는다
#   네이티브 바뀜 / 스토어 빌드 기록 없음        → 스토어용 빌드 업로드 (iOS TestFlight,
#                                                  Android auto.android_track). 심사 제출은 안 한다.
#
# 릴리스 커밋(expo-release 스킬이 app.json 빌드 번호를 올린 커밋)은 스토어 출시로 처리한다:
#   app.json ios.buildNumber 바뀜     → iOS 업로드 (심사 제출은 사람이 ASC에서)
#   app.json android.versionCode 바뀜 → Play android.track에 android.release_status로 업로드
#   fastlane/metadata·screenshots    → App Store 앱 정보·스크린샷
#   fastlane/android                 → Play 앱 정보·스크린샷
#
# 스토어 빌드가 올라가면 태그 <플랫폼>-v<버전>-<빌드>를 찍고 메시지에 fingerprint=<hash>를 남긴다.
# 자동 빌드는 app.json을 커밋하지 않는다 — 빌드 번호는 태그가 기록이다(version.sh next).
#
# 시크릿
#   iOS:     ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8(.p8을 base64) — 키 권한 Admin
#   Android: PLAY_SERVICE_ACCOUNT_JSON_B64, ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD,
#            ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   OTA:     EXPO_TOKEN
#   설정 ci.secrets에 적은 프로젝트 비밀(.env.production 등) — ci.setup이 파일로 복원한다
name: Expo Release

on:
  push:
    branches: [__BRANCH__]
  workflow_dispatch:
    inputs:
      ios:
        description: iOS 업로드 (app.json 번호 그대로 — 릴리스)
        type: boolean
        default: false
      android:
        description: Android 업로드 (app.json 번호 그대로 — 릴리스)
        type: boolean
        default: false
      metadata:
        description: 앱 정보 반영 (두 스토어)
        type: boolean
        default: false
      screenshots:
        description: App Store 스크린샷 교체
        type: boolean
        default: false
      cancel_review:
        description: App Store 심사 대기 중이면 철회하고 반영한 뒤 다시 제출 (심사 순서를 잃는다)
        type: boolean
        default: false
      update:
        description: OTA 업데이트 (EAS Update)
        type: boolean
        default: false
      update_platforms:
        description: OTA 플랫폼 (공백 구분, 비우면 전부)
        type: string
        default: ""
      message:
        description: OTA 업데이트 메시지
        type: string
        default: ""
      dry_run:
        description: 올리지 않고 서명까지만 (iOS·Android)
        type: boolean
        default: false

# 두 릴리스가 동시에 올라가면 번호·앱 정보가 엇갈린다. 앞의 것을 끝까지 둔다.
concurrency:
  group: expo-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.p.outputs.ios }}
      android: ${{ steps.p.outputs.android }}
      ios_meta: ${{ steps.p.outputs.ios_meta }}
      ios_screenshots: ${{ steps.p.outputs.ios_screenshots }}
      android_meta: ${{ steps.p.outputs.android_meta }}
      ota: ${{ steps.p.outputs.ota }}
      message: ${{ steps.p.outputs.message }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with:
          node-version: 24
          cache: npm
      - name: 준비 (fingerprint용)
        if: github.event_name == 'push'
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          . scripts/expo-release/lib.sh
          export_secrets
          setup=$(cfg ci.setup)
          if [ -n "$setup" ]; then bash -c "$setup"; else npm ci; fi
      - id: p
        env:
          BEFORE: ${{ github.event.before }}
          IN_MESSAGE: ${{ inputs.message }}
          IN_PLATFORMS: ${{ inputs.update_platforms }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # ios·android: release(app.json 번호로 출시) | auto(번호를 태그에서 이어 받아 테스트 업로드) | none
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "ios=$([ '${{ inputs.ios }}' = true ] && echo release || echo none)"
            echo "android=$([ '${{ inputs.android }}' = true ] && echo release || echo none)"
            echo "ios_meta=$([ '${{ inputs.metadata }}' = true ] || [ '${{ inputs.screenshots }}' = true ] && echo true || echo false)"
            echo "ios_screenshots=${{ inputs.screenshots }}"
            echo "android_meta=${{ inputs.metadata }}"
            if [ '${{ inputs.update }}' = true ]; then echo "ota=${IN_PLATFORMS:-all}"; else echo "ota="; fi
            echo "message=$IN_MESSAGE"
          elif grep -qF '[skip release]' <<<"$HEAD_MESSAGE"; then
            echo "::notice::[skip release] — 배포하지 않는다" >&2
            printf '%s\n' ios=none android=none ota= message= ios_meta=false ios_screenshots=false android_meta=false
          else
            # 브랜치를 새로 만든 푸시면 before가 0으로 온다
            base="$BEFORE"; git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
            d=$(bash scripts/expo-release/release-diff.sh "$base" HEAD)
            a=$(bash scripts/expo-release/auto-plan.sh "$base" HEAD)
            get() { printf '%s\n%s\n' "$d" "$a" | sed -n "s/^$1=//p" | head -1; }
            ota=""
            # 릴리스 커밋(빌드 번호를 올린 커밋)은 출시만 한다 — 자동 빌드·OTA를 섞지 않는다
            release=$([ "$(get ios_build)" = true ] || [ "$(get android_build)" = true ] && echo true || echo false)
            for p in ios android; do
              if [ "$(get ${p}_build)" = true ]; then act=release
              elif [ "$release" = true ]; then act=none
              else case "$(get $p)" in build) act=auto ;; ota) act=none; ota="$ota $p" ;; *) act=none ;; esac; fi
              echo "$p=$act"
              echo "::notice title=$p::$act — $(get ${p}_reason)" >&2
            done
            echo "ota=${ota# }"
            echo "message=$(get message)"
            echo "ios_meta=$([ "$(get ios_metadata)" = true ] || [ "$(get ios_screenshots)" = true ] && echo true || echo false)"
            echo "ios_screenshots=$(get ios_screenshots)"
            echo "android_meta=$(get android_metadata)"
          fi | tee -a "$GITHUB_OUTPUT"
          # 꺼진 플랫폼은 건너뛴다
          for p in ios android; do
            on=$(python3 -c "import json;print(str(json.load(open('.expo-release.json')).get('$p',{}).get('enabled',False)).lower())")
            [ "$on" = true ] || { echo "$p=none" >> "$GITHUB_OUTPUT"; echo "${p}_meta=false" >> "$GITHUB_OUTPUT"; }
          done
      - name: 비밀 파일 지우기
        if: always() && github.event_name == 'push'
        run: . scripts/expo-release/lib.sh; c=$(cfg ci.cleanup); [ -z "$c" ] || bash -c "$c"

  ios:
    needs: plan
    if: needs.plan.outputs.ios != 'none' || needs.plan.outputs.ios_meta == 'true'
    runs-on: __RUNNER__
    timeout-minutes: 75
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_PATH: ${{ github.workspace }}/../AuthKey.p8
      ACT: ${{ needs.plan.outputs.ios }}
      # C++(React Native·Hermes·네이티브 모듈) 컴파일 결과를 실행 사이에 재사용한다.
      # Podfile이 USE_CCACHE=1을 보고 ccache를 켠다 — 앱 설정을 안 바꾸니 fingerprint도 그대로다.
      USE_CCACHE: '1'
      CCACHE_DIR: /Users/runner/.ccache   # 호스티드 macOS 러너의 홈
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Xcode 고르기
        # 설정 ios.xcode(예: "26")와 맞는 설치본 중 최신을 고른다. 비우면 러너 기본값.
        run: |
          . scripts/expo-release/lib.sh; want=$(cfg ios.xcode)
          if [ -n "$want" ]; then
            # 베타·RC로 빌드하면 App Store가 업로드를 거부한다
            app=$(printf '%s\n' /Applications/Xcode_"$want"*.app | grep -viE 'beta|release_candidate|\*' | sort -V | tail -1 || true)
            [ -n "$app" ] || { echo "::error::Xcode $want가 이 러너에 없다"; exit 1; }
            sudo xcode-select -s "$app"
          fi
          xcodebuild -version
          command -v ccache >/dev/null || brew install ccache
      - name: ccache·CocoaPods 캐시
        uses: actions/cache@v4
        with:
          path: |
            /Users/runner/.ccache
            ~/Library/Caches/CocoaPods
          # ccache는 매번 새로 저장해야 쌓인다 — 커밋마다 키를 바꾸고 직전 것을 복원한다
          key: ios-build-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ios-build-${{ hashFiles('package-lock.json') }}-
            ios-build-
      - name: API 키
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] \
            || { echo "::error::시크릿 ASC_KEY_P8·ASC_KEY_ID·ASC_ISSUER_ID가 필요하다"; exit 1; }
          echo "$ASC_KEY_P8" | base64 --decode > "$ASC_KEY_PATH"; chmod 600 "$ASC_KEY_PATH"
      - name: 준비
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          . scripts/expo-release/lib.sh
          export_secrets
          setup=$(cfg ci.setup)
          if [ -n "$setup" ]; then bash -c "$setup"; else npm ci; fi
          command -v fastlane >/dev/null || brew install fastlane
      - name: 번호 정하기 (자동 빌드)
        if: env.ACT == 'auto'
        # app.json은 커밋하지 않는다. 승인된 버전은 트레인이 닫혀 있어 패치를 올린다.
        run: |
          v=$(bash scripts/expo-release/version.sh latest ios)
          n=$(bash scripts/expo-release/version.sh next ios)
          OUT=$RUNNER_TEMP/state fastlane ios version_state version:"$v"
          [ "$(cat $RUNNER_TEMP/state)" = open ] || v=$(bash scripts/expo-release/version.sh bump-patch "$v")
          bash scripts/expo-release/version.sh set "$v" --ios "$n"
      - name: fingerprint
        id: fp
        if: env.ACT != 'none'
        # prebuild 전에 잰다 — OTA 쪽(prebuild 없음)과 같은 조건이어야 같은 값이 나온다
        run: |
          echo "hash=$(bash scripts/expo-release/fingerprint.sh hash ios)" | tee -a "$GITHUB_OUTPUT"
          read -r v b _ < <(bash scripts/expo-release/version.sh get)
          echo "tag=ios-v$v-$b" | tee -a "$GITHUB_OUTPUT"
      - name: 아카이브·업로드
        if: env.ACT != 'none'
        env:
          DESTINATION: ${{ inputs.dry_run && 'export' || 'upload' }}
          FINGERPRINT: ${{ steps.fp.outputs.hash }}
        run: |
          xcodebuild -version
          bash scripts/expo-release/ios-build-upload.sh
      - name: 앱 정보·스크린샷
        if: needs.plan.outputs.ios_meta == 'true'
        run: |
          read -r v _ _ < <(bash scripts/expo-release/version.sh get)
          fastlane ios metadata screenshots:${{ needs.plan.outputs.ios_screenshots }} \
            version:"$v" cancel_review:${{ inputs.cancel_review || false }}
      - name: 태그
        if: env.ACT != 'none' && !inputs.dry_run
        run: |
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            tag -a "${{ steps.fp.outputs.tag }}" -m "fingerprint=${{ steps.fp.outputs.hash }}"
          git push origin "${{ steps.fp.outputs.tag }}"
          echo "::notice title=iOS::${{ steps.fp.outputs.tag }} 업로드 ($ACT) — TestFlight 처리 후 사용 가능. 심사 제출은 App Store Connect에서."
      - name: 키·비밀 파일 지우기
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH"
          . scripts/expo-release/lib.sh; c=$(cfg ci.cleanup); [ -z "$c" ] || bash -c "$c"

  android:
    needs: plan
    if: needs.plan.outputs.android != 'none' || needs.plan.outputs.android_meta == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 폰은 arm뿐이다 — x86·x86_64(에뮬레이터용) 네이티브 컴파일을 빼서 빌드 시간을 줄인다
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,armeabi-v7a
      PLAY_JSON_KEY_PATH: ${{ github.workspace }}/../play.json
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/../upload.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ACT: ${{ needs.plan.outputs.android }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: 키
        env:
          PLAY_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON_B64" ] || { echo "::error::시크릿 PLAY_SERVICE_ACCOUNT_JSON_B64가 필요하다"; exit 1; }
          echo "$PLAY_SERVICE_ACCOUNT_JSON_B64" | base64 --decode > "$PLAY_JSON_KEY_PATH"; chmod 600 "$PLAY_JSON_KEY_PATH"
          if [ "$ACT" != none ]; then
            [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ] \
              || { echo "::error::시크릿 ANDROID_KEYSTORE_B64·ANDROID_KEYSTORE_PASSWORD·ANDROID_KEY_ALIAS·ANDROID_KEY_PASSWORD가 필요하다"; exit 1; }
            echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"; chmod 600 "$ANDROID_KEYSTORE_PATH"
          fi
      - name: 준비
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          . scripts/expo-release/lib.sh
          export_secrets
          setup=$(cfg ci.setup)
          if [ -n "$setup" ]; then bash -c "$setup"; else npm ci; fi
          gem install fastlane --no-document
      - name: 번호 정하기 (자동 빌드)
        if: env.ACT == 'auto'
        run: |
          bash scripts/expo-release/version.sh set "$(bash scripts/expo-release/version.sh latest android)" \
            --android "$(bash scripts/expo-release/version.sh next android)"
      - name: fingerprint
        id: fp
        if: env.ACT != 'none'
        run: |
          echo "hash=$(bash scripts/expo-release/fingerprint.sh hash android)" | tee -a "$GITHUB_OUTPUT"
          read -r v _ c < <(bash scripts/expo-release/version.sh get)
          echo "tag=android-v$v-$c" | tee -a "$GITHUB_OUTPUT"
      - name: AAB 빌드
        if: env.ACT != 'none'
        env:
          FINGERPRINT: ${{ steps.fp.outputs.hash }}
        run: bash scripts/expo-release/android-build.sh
      - name: Play 업로드
        if: (env.ACT != 'none' && !inputs.dry_run) || needs.plan.outputs.android_meta == 'true'
        run: |
          . scripts/expo-release/lib.sh
          aab=""; extra=()
          if [ "$ACT" != none ] && [ "${{ inputs.dry_run || false }}" != true ]; then
            aab=build/expo-release/android/app-release.aab
          fi
          if [ "$ACT" = auto ]; then
            t=$(cfg auto.android_track); extra=(track:"${t:-internal}" release_status:completed)
          fi
          fastlane android upload aab:"$aab" metadata:${{ needs.plan.outputs.android_meta }} "${extra[@]}"
      - name: 태그
        if: env.ACT != 'none' && !inputs.dry_run
        run: |
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            tag -a "${{ steps.fp.outputs.tag }}" -m "fingerprint=${{ steps.fp.outputs.hash }}"
          git push origin "${{ steps.fp.outputs.tag }}"
          echo "::notice title=Android::${{ steps.fp.outputs.tag }} 업로드 ($ACT)"
      - name: 키·비밀 파일 지우기
        if: always()
        run: |
          rm -f "$PLAY_JSON_KEY_PATH" "$ANDROID_KEYSTORE_PATH"
          . scripts/expo-release/lib.sh; c=$(cfg ci.cleanup); [ -z "$c" ] || bash -c "$c"

  update:
    needs: plan
    if: needs.plan.outputs.ota != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 준비
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error::시크릿 EXPO_TOKEN이 필요하다"; exit 1; }
          . scripts/expo-release/lib.sh
          export_secrets
          setup=$(cfg ci.setup)
          if [ -n "$setup" ]; then bash -c "$setup"; else npm ci; fi
      - name: EAS Update
        env:
          MESSAGE: ${{ needs.plan.outputs.message }}
          PLATFORMS: ${{ needs.plan.outputs.ota }}
        run: |
          [ -n "$MESSAGE" ] || { echo "::error::message가 필요하다"; exit 1; }
          [ "$PLATFORMS" = all ] && PLATFORMS=""
          bash scripts/expo-release/update.sh "$MESSAGE" $PLATFORMS
      - name: 비밀 파일 지우기
        if: always()
        run: . scripts/expo-release/lib.sh; c=$(cfg ci.cleanup); [ -z "$c" ] || bash -c "$c"
